name: Publish approved Latest Digital Releases GIF
on:
  push:
    paths:
      - scripts/build_approved_latest_gif.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python scripts/build_approved_latest_gif.py
      - name: Publish approved animated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vespertv-latest-digital-approved-animated-v2.gif
          git commit -m "Publish approved Latest Digital animated artwork" || exit 0
          git push
