name: Publish cinematic Movie Releases hero backgrounds
on:
  push:
    paths:
      - scripts/build_movie_release_hero.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python scripts/build_movie_release_hero.py
      - name: Commit hero assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vespertv-latest-digital-hero-cinematic.png assets/vespertv-upcoming-hero-cinematic.png
          git commit -m "Publish Movie Releases hero backgrounds" || exit 0
          git push
