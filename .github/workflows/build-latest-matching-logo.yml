name: Match Latest Digital logo to Upcoming
on:
  push:
    paths:
      - scripts/build_latest_matching_logo.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python scripts/build_latest_matching_logo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vespertv-latest-matching-upcoming-logo-v4.gif
          git commit -m "Publish Latest Digital with matching VesperTV wordmark" || exit 0
          git push
